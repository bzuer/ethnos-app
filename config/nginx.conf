map $http_x_forwarded_proto $ethnos_app_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $request_uri $ethnos_app_en_redirect {
    default                "";
    ~^/en(\?.*)?$          /$1;
    ~^/en(/[^?]*)(\?.*)?$  $1$2;
}

log_format ethnos_app_timed '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                            'rt=$request_time urt=$upstream_response_time '
                            'ip=$http_cf_connecting_ip ray=$http_cf_ray';

upstream ethnos_app {
    zone ethnos_app 64k;
    server __UPSTREAM_HOST__:__UPSTREAM_PORT__ max_conns=64 max_fails=0;
    keepalive 16;
}

server {
__LISTEN_DIRECTIVES__
    server_name __SERVER_NAME__;__SSL_DIRECTIVES__

    server_tokens off;
    client_max_body_size __CLIENT_MAX_BODY_SIZE__;
    absolute_redirect off;

    access_log /var/log/nginx/ethnos-app.access.log ethnos_app_timed;
    error_log /var/log/nginx/ethnos-app.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/manifest+json image/svg+xml
               text/x-component;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ethnos_app_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 5s;
    proxy_read_timeout __PROXY_TIMEOUT__;
    proxy_send_timeout __PROXY_TIMEOUT__;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_intercept_errors off;

    location / {
        if ($ethnos_app_en_redirect) {
            add_header Cache-Control "public, max-age=3600, s-maxage=86400";
            return 308 $ethnos_app_en_redirect;
        }
        proxy_pass http://ethnos_app;
    }
}
