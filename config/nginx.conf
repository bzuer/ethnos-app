#############################################################################
# Nginx front door for the Ethnos frontend
#
# Every port anything reaches is owned by nginx, and nginx itself listens on
# loopback: the only client of this port is the tunnel connector running on
# this same host. Next runs as `next start -H localhost -p __UPSTREAM_PORT__`,
# which listens on __UPSTREAM_HOST__:__UPSTREAM_PORT__ (loopback, not routable),
# so the documented app port stays the same for the edge while the application
# itself moved behind the proxy — the topology the API already uses
# (nginx :1211 -> node :1201).
#
# The bind host is the name, not the address: with `-H 127.0.0.1` Next stops
# recognising its own middleware rewrites and every default-locale URL 307s to
# itself. Set NGINX_LISTEN_ADDRESS= (empty) only if the connector ever moves
# off this host and has to reach the port over the network.
#
# One server block serves both listeners: `ssl` is a per-listen parameter, so
# the plain and the TLS port share a single proxy body. The TLS listen and the
# certificate directives are rendered empty when no certificate is configured.
#
# Deploy: scripts/nginx/render-config.sh fills these placeholders from
# /etc/next-frontend.env and installs the result to
# /etc/nginx/conf.d/ethnos-app.conf. The repo copy keeps the placeholders.
#############################################################################

# TLS terminates at the edge (Cloudflare), which sends X-Forwarded-Proto itself.
# Overwriting it with $scheme would tell the application every request is http.
# The map is global to the nginx process, hence the site-specific variable name.
map $http_x_forwarded_proto $ethnos_app_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream ethnos_app {
    server __UPSTREAM_HOST__:__UPSTREAM_PORT__ max_fails=0;
    keepalive 32;
}

server {
__LISTEN_DIRECTIVES__
    server_name __SERVER_NAME__;__SSL_DIRECTIVES__

    server_tokens off;
    client_max_body_size __CLIENT_MAX_BODY_SIZE__;

    access_log /var/log/nginx/ethnos-app.access.log;
    error_log /var/log/nginx/ethnos-app.error.log;

    # No add_header here: nosniff, Referrer-Policy, X-DNS-Prefetch-Control and the
    # per-route Cache-Control come from next.config.mjs#headers(), and a header
    # added at this level would ship a duplicate of each.

    # Responses Next already compressed carry Content-Encoding and are skipped by
    # this module, so the two compressors never stack.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/manifest+json image/svg+xml;

    proxy_http_version 1.1;
    # Keepalive to the upstream requires the hop-by-hop Connection header cleared.
    proxy_set_header Connection "";

    # Host must stay the public hostname: a Server Action POST is rejected when the
    # Origin the browser sent does not match the forwarded host.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ethnos_app_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 5s;
    # Above the 8s fetchJson timeout and its retries, so a slow API answers through
    # the application's own error handling instead of nginx cutting the socket.
    proxy_read_timeout __PROXY_TIMEOUT__;
    proxy_send_timeout __PROXY_TIMEOUT__;

    # Streaming: RSC payloads and streamed HTML must reach the browser as they are
    # produced, which buffering would hold back until the response is complete.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;

    # The application owns its error pages: maintenance mode answers 503 and a
    # missing entity answers 404 from not-found.tsx. Intercepting either would
    # replace a localized page with the nginx default.
    proxy_intercept_errors off;

    location / {
        proxy_pass http://ethnos_app;
    }
}
